name: release

# Tag-driven release: pushing a vX.Y.Z tag renders the body with glyph's
# release-notes action, then runs GoReleaser (binaries, checksums, Homebrew cask)
# and attaches build-provenance attestations.
# Deliberately NOT on every main push — that would run GoReleaser with no tag.
# Dispatch workflow_dispatch on a tag ref only: the notes action takes the ref
# as the tag being released, and a branch name fails it (exit 2).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub release
  id-token: write      # keyless signing for provenance attestation
  attestations: write  # write the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # glyph and GoReleaser only READ local git; every write (release,
          # cask push) goes through API tokens passed as env, never git — drop
          # the persisted checkout token (zizmor artipacked). t-yaxa
          persist-credentials: false

      # No job-level `env: GOTOOLCHAIN: local` — see build.yml. It would make
      # setup-go skip go.mod's `toolchain` line and ship release binaries built
      # with the bare floor. setup-go pins GOTOOLCHAIN=local itself.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Release binaries must not be built from a shared, poisonable module
          # cache (zizmor cache-poisoning); PR-time caching stays in build.yml.
          # t-yaxa
          cache: false

      # The pin is a CONCRETE glyph release tag — the action verifies the
      # binary against that release's checksums + build provenance. Keep this
      # ref, `version:` and the release-notes action's ref below in lockstep
      # when bumping: that action runs the binary installed here.
      - name: install glyph
        uses: akira-toriyama/glyph/.github/actions/install@v6.1.0
        with:
          version: v6.1.0
          token: ${{ github.token }}

      # The tag-time notes rule is the action's (its header), not this file's:
      # glyph resolves the walk base itself (`--since-tag=below:<tag>`), and
      # every tag, rc or full, walks from the last full release below it — a
      # hand-rolled `git describe HEAD^` takes an rc as the base. Exits 1
      # (nothing release-worthy) and 3 (the walk reaches a commit glyph refuses —
      # the wedge-escape tag's own walk always does) publish a placeholder body
      # that says why, so the pushed tag never ends up without assets; every
      # other exit fails the job. The walk reads tags and history: keep
      # checkout's fetch-depth: 0.
      - name: release notes (glyph)
        id: notes
        uses: akira-toriyama/glyph/.github/actions/release-notes@v6.1.0
        with:
          token: ${{ github.token }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Pin the GoReleaser TOOL to the v2 line (never `latest`).
          version: "~> 2"
          args: release --clean --release-notes ${{ steps.notes.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private half of homebrew-tap's write deploy key (fleet-sync fans it
          # out); GoReleaser pushes the cask over SSH with it. t-6bhz
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz, dist/checksums.txt'
